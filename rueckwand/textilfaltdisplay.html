<title>Swibble Rückwand – Flyeralarm Textilfaltdisplay Classic 12 Felder</title>
<!-- Druckdaten-Vorschau für „Textilfaltdisplay Classic, System inkl. Druck“ (Flyeralarm), 12 Felder, 302 × 227 × 29 cm
     Druckmaß 296,5 × 226,5 cm → 2965 × 2265 px (1 px = 1 mm), einseitig CMYK, Polyester-Sublimation.
     Wichtige Inhalte über 100 cm Höhe (y < 1265), da Podest und Roll-up davor stehen.
     Logo-Regeln (Design System „Swibble“): Symbol nur im Original-Verlauf, nicht umfärben; max. drei Lila-Töne. -->

<style>
body{margin:0}
.wand{position:relative;width:2965px;height:2265px;overflow:hidden;background:#000D36;font-family:Poppins,system-ui,sans-serif;color:#fff}
.tile{position:absolute;border-radius:110px;transform:skewX(-12deg) rotate(-6deg)}
</style>
</head>
<body>
<div class="wand">
  <!-- Markenmotiv: drei Lila-Töne, deckend -->

  <div class="tile" style="left:1900px;top:170px;width:960px;height:1060px;background:#F4E3F9"></div>
  <div class="tile" style="left:-260px;top:1720px;width:3600px;height:800px;background:#B718EC"></div>

  <!-- Symbol im Original-Verlauf auf der hellen Kachel -->

  <img src="../assets/brand/swibble-logo-white.svg" alt="Swibble" style="position:absolute;left:190px;top:200px;width:1050px;height:auto">

  <div style="position:absolute;left:195px;top:560px;width:1650px;display:flex;flex-direction:column;gap:50px">
    <div style="font-size:70px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#EBC5F7">Digitalagentur aus Aachen</div>
    <div style="font-size:170px;line-height:1;font-weight:800;letter-spacing:-0.035em">Deine Marke.<br><span style="color:#B718EC">Nächstes Level.</span></div>
  </div>

  <div style="position:absolute;left:195px;top:1110px;display:flex;gap:40px;font-size:56px;font-weight:700">
    <span>Social Media</span><span style="color:#B718EC">·</span><span>Live-Events</span><span style="color:#B718EC">·</span><span>Design</span><span style="color:#B718EC">·</span><span>Software</span>
  </div>
  <div style="position:absolute;left:195px;top:1215px;font-size:72px;font-weight:600;color:#EBC5F7">www.swibble.net</div>
</div>
