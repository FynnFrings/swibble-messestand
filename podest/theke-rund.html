<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Swibble Podest – Flyeralarm Messetheke rund, Druckbahn</title>
<!-- Druckdaten-Vorschau für „Messetheken rund, System inkl. Druck“ (Flyeralarm)
     Druckformat 129 × 90 cm → 1290 × 900 px (1 px = 1 mm), 4/0 CMYK auf 400 µm Hart-PVC matt.
     Sichtbare Front beim Aufstellen = Mitte der Bahn (x 645). Naht/Klettverschluss = linke und rechte Kante. -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.bahn{position:relative;width:1290px;height:900px;overflow:hidden;background:#000D36;font-family:Poppins,system-ui,sans-serif;color:#fff}
.shape{position:absolute;border-radius:40px;transform:skewX(-18deg) rotate(-8deg)}
.front{position:absolute;left:445px;top:0;width:400px;height:900px;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:92px;box-sizing:border-box;gap:30px}
.side{position:absolute;top:120px;width:300px;display:flex;flex-direction:column;gap:26px}
.svc{display:flex;flex-direction:column;gap:2px}
.svc b{font-size:34px;font-weight:700;line-height:1.1}
.svc span{font-size:19px;color:#EBC5F7;line-height:1.35}
</style>
</head>
<body>
<div class="bahn">
  <div class="shape" style="left:-120px;top:640px;width:560px;height:260px;background:#7610AA"></div>
  <div class="shape" style="left:930px;top:-80px;width:460px;height:240px;background:#963BC4;opacity:.55"></div>
  <div class="shape" style="left:1010px;top:690px;width:420px;height:300px;background:#B718EC"></div>
  <div class="shape" style="left:520px;top:780px;width:360px;height:200px;background:#B718EC;opacity:.9"></div>

  <!-- Seite links -->
  <div class="side" style="left:90px">
    <div class="svc"><b>Social Media</b><span>Viraler Content für deine Kanäle</span></div>
    <div class="svc"><b>Live-Events</b><span>Im Unternehmen, auf Messen oder online</span></div>
  </div>

  <!-- Front -->
  <div class="front">
    <img src="../assets/brand/swibble-symbol.svg" alt="" style="width:230px;height:230px;margin:-30px 0 -20px">
    <img src="../assets/brand/swibble-logo-white.svg" alt="Swibble" style="width:300px;height:auto">
    <div style="font-size:52px;font-weight:800;line-height:1.02;letter-spacing:-0.03em">Lass uns<br>über dein<br><span style="color:#B718EC">Projekt</span> reden.</div>
    <div style="background:#fff;color:#000D36;border-radius:26px;padding:20px 24px;display:flex;gap:18px;align-items:center;text-align:left">
      <img src="../assets/brand/qr-meet-swibble.svg" alt="QR-Code zu meet.swibble.net" style="width:120px;height:120px">
      <div style="display:flex;flex-direction:column;gap:4px">
        <div style="font-size:14px;font-weight:600;letter-spacing:.06em;color:#7610AA">JETZT SCANNEN</div>
        <div style="font-size:22px;font-weight:700;line-height:1.15">Kostenloses<br>Erstgespräch</div>
      </div>
    </div>
  </div>

  <!-- Seite rechts -->
  <div class="side" style="left:910px">
    <div class="svc"><b>Design</b><span>Brand, Print, Werbung und UI</span></div>
    <div class="svc"><b>Software</b><span>Apps, Websites und eigene Lösungen</span></div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:30px;font-weight:700;letter-spacing:-0.01em">www.swibble.net</div>
</div>
</body>
</html>
